name: EAS Build (AAB)

# Builds an Android App Bundle (AAB) with EAS on every push to master,
# in parallel with eas-build-apk.yml. Build only — does not submit to
# the Play Store.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build AAB
        run: eas build --platform android --profile production --non-interactive --wait
