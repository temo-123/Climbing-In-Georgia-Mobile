name: EAS Build (APK)

# APK build for sideloading, QA, or sharing outside the Play Store. Runs
# in parallel with eas-build-aab.yml on every push to master.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build APK
        run: eas build --platform android --profile production-apk --non-interactive --wait
