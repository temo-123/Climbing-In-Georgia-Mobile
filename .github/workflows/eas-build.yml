name: EAS Build (Android)

# Runs automatically on every push to master, and can also be run
# manually from the Actions tab. Builds both artifacts every run: an
# .aab (production profile) and a standalone .apk (production-apk
# profile, same version, for direct/internal distribution outside the
# store). Build only — nothing is submitted to the Play Store. See
# CLAUDE.md's "Build Android (EAS cloud build)" section for the
# equivalent local commands.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-build-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build .aab
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Build .apk (direct-install build)
        run: eas build --platform android --profile production-apk --non-interactive --wait
